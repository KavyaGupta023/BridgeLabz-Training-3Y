<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <table border="1">
        <caption>Available Products</caption>

        <tr>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="laptop.jpg" alt="Laptop" width="100">
                <br>
                Laptop
            </td>
            <td>High-performance laptop for students.</td>
            <td>₹55,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="headphones.jpg" alt="Headphones" width="100">
                <br>
                Headphones
            </td>
            <td>Wireless noise-cancelling headphones.</td>
            <td>₹3,500</td>
        </tr>

        <tr>
            <td>
                <img src="mouse.jpg" alt="Mouse" width="100">
                <br>
                Mouse
            </td>
            <td>Wireless optical mouse.</td>
            <td>₹800</td>
            <td>Out of Stock</td>
        </tr>

        <tr>
            <td colspan="4">More products coming soon.</td>
        </tr>
    </table>

</body>
</html>
