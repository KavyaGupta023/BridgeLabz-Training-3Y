```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Tooltip Demonstration</h1>
</header>

<main class="tooltip-container">

    <div class="tooltip-box">
        HTML
        <span class="tooltip">HyperText Markup Language</span>
    </div>

    <div class="tooltip-box">
        CSS
        <span class="tooltip">Cascading Style Sheets</span>
    </div>

    <div class="tooltip-box">
        VS Code
        <span class="tooltip">Code Editor</span>
    </div>

    <div class="tooltip-box">
        Git
        <span class="tooltip">Version Control System</span>
    </div>

</main>

<footer>
    <p>Hover over each element to see the tooltip.</p>
</footer>

</body>
</html>
