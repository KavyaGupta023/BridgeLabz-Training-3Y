<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>A linear gradient changes colors along a straight line.</p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>A radial gradient spreads colors from a central point.</p>
        </section>
    </main>

    <footer>
        <p>Gradient Background Demonstration</p>
    </footer>

</body>
</html>
