<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
</header>

<main>
    <section class="gallery">

        <figure>
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Nature">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://picsum.photos/id/1016/400/300" alt="Mountain">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://picsum.photos/id/1035/400/300" alt="Landscape">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/id/1043/400/300" alt="Forest">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/id/1069/400/300" alt="River">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>Responsive CSS Gallery</p>
</footer>

</body>
</html>
