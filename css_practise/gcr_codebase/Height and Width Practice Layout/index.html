<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main>
        <section class="container">

            <div class="box box-one">
                <h2>Box 1</h2>
                <p>Width: 200px<br>Height: 150px</p>
            </div>

            <div class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 30%<br>Height: 20vh</p>
            </div>

            <div class="box box-three">
                <h2>Box 3</h2>
                <p>Width: 15em<br>Overflow Example</p>
                <p>This extra content demonstrates the overflow property.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Height and Width Practice</p>
    </footer>
</body>
</html>
