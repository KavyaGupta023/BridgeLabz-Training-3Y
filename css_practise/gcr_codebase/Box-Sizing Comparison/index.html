```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main class="comparison">

    <section class="box content-box">
        <h2>Content-Box</h2>
        <p>
            Width includes only the content.
            Padding and border are added to the total size.
        </p>
    </section>

    <section class="box border-box">
        <h2>Border-Box</h2>
        <p>
            Width includes content, padding and border.
            This makes sizing easier to control.
        </p>
    </section>

</main>

</body>
</html>
```
