<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

<header>
    <h1>Profile Cards</h1>
</header>

<main class="profiles">

    <article class="profile-card">
        <img class="gray" src="https://picsum.photos/id/64/400/300" alt="Profile">
        <h2>Alex</h2>
        <p>Web Developer</p>
    </article>

    <article class="profile-card">
        <img class="sepia" src="https://picsum.photos/id/91/400/300" alt="Profile">
        <h2>Sarah</h2>
        <p>UI Designer</p>
    </article>

    <article class="profile-card">
        <img class="gray" src="https://picsum.photos/id/177/400/300" alt="Profile">
        <h2>David</h2>
        <p>Software Engineer</p>
    </article>

</main>

</body>
</html>
